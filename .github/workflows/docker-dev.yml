name: docker-dev

on:
  push:
    branches: [master, main, dev, develop]
  workflow_dispatch:

permissions:
  contents: read

# All branches publish the same :dev tag. Let the active run finish before
# another run can publish; GitHub keeps at most one pending run in this group.
concurrency:
  group: docker-dev
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    # Share the lock with formal releases through the end of cleanup. Queue
    # releases instead of letting a newer dev run replace a pending release.
    concurrency:
      group: ghcr-package-publish
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      packages: write
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: smoke-root
          MYSQL_DATABASE: antcdp_smoke
          MYSQL_USER: smoke
          MYSQL_PASSWORD: smoke-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s --health-timeout=5s --health-retries=25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/build-web

      - name: Build Linux binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          VERSION=$(git describe --tags --always --dirty)
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o antcdp ./cmd/antcdp
      - name: Compute image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          IMAGE_PATH="${REPOSITORY,,}"
          echo "name=ghcr.io/${IMAGE_PATH}:dev" >> "$GITHUB_OUTPUT"
          echo "package=${IMAGE_PATH#*/}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build dev image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          # Keep this single-platform image free of untagged attestation
          # dependencies; cleanup still checks all tagged manifests below.
          provenance: false
          sbom: false
          tags: ${{ steps.image.outputs.name }}

      - name: Smoke test dev image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          EXPECTED=$(./antcdp version)
          ACTUAL=$(docker run --rm "$IMAGE" version)
          test "$ACTUAL" = "$EXPECTED"
          CONF=$(mktemp -d)
          chmod 755 "$CONF"
          cat > "$CONF/config.toml" <<'TOML'
          [database]
          host = "127.0.0.1"
          port = 3306
          name = "antcdp_smoke"
          username = "smoke"
          password = "smoke-only"
          tls_mode = "disabled"
          TOML
          docker run -d --name antcdp-smoke --network host \
            --mount "type=bind,src=$CONF,dst=/app/conf,readonly" \
            --mount type=volume,src=antcdp-smoke-data,dst=/app/data "$IMAGE"
          wait_for_setup() {
            for attempt in {1..45}; do
              if curl -fsS http://127.0.0.1:8080/api/v1/setup/status | jq -e '.data.state == "setup_required"' >/dev/null; then return 0; fi
              sleep 1
            done
            docker logs antcdp-smoke
            return 1
          }
          wait_for_setup
          BEFORE=$(docker exec antcdp-smoke sha256sum /app/data/install-password)
          docker restart antcdp-smoke
          wait_for_setup
          test "$BEFORE" = "$(docker exec antcdp-smoke sha256sum /app/data/install-password)"


      - name: Push tested dev image
        id: publish
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker push "$IMAGE"
          REFERENCE=$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')
          echo "digest=${REFERENCE#*@}" >> "$GITHUB_OUTPUT"

      - name: Check tagged image dependencies before cleanup
        id: cleanup-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_DEV_DIGEST: ${{ steps.publish.outputs.digest }}
        run: node scripts/check-ghcr-cleanup.mjs

      - name: Keep the latest 10 untagged container versions
        if: steps.cleanup-check.outputs.safe == 'true'
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ steps.image.outputs.package }}
          package-type: container
          delete-only-untagged-versions: 'true'
          min-versions-to-keep: 10

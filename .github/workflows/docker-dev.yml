name: docker-dev

on:
  push:
    branches: [master, main, dev, develop]
  workflow_dispatch:

permissions:
  contents: read

# All branches publish the same :dev tag. Let the active run finish before
# another run can publish; GitHub keeps at most one pending run in this group.
concurrency:
  group: docker-dev
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  docker:
    needs: verify
    runs-on: ubuntu-latest
    # Share the lock with formal releases through the end of cleanup. Queue
    # releases instead of letting a newer dev run replace a pending release.
    concurrency:
      group: ghcr-package-publish
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web frontend
        shell: bash
        run: bash scripts/build-web.sh

      - name: Build Linux binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          VERSION=$(git describe --tags --always --dirty)
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o antcdp ./cmd/antcdp
      - name: Compute image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          IMAGE_PATH="${REPOSITORY,,}"
          echo "name=ghcr.io/${IMAGE_PATH}:dev" >> "$GITHUB_OUTPUT"
          echo "package=${IMAGE_PATH#*/}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push dev image
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          # Keep this single-platform image free of untagged attestation
          # dependencies; cleanup still checks all tagged manifests below.
          provenance: false
          sbom: false
          tags: ${{ steps.image.outputs.name }}

      - name: Check tagged image dependencies before cleanup
        id: cleanup-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_DEV_DIGEST: ${{ steps.publish.outputs.digest }}
        run: node scripts/check-ghcr-cleanup.mjs

      - name: Keep the latest 10 untagged container versions
        if: steps.cleanup-check.outputs.safe == 'true'
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ steps.image.outputs.package }}
          package-type: container
          delete-only-untagged-versions: 'true'
          min-versions-to-keep: 10

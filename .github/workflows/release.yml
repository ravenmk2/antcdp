# .github/workflows/release.yml
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write   # push to GHCR

jobs:
  verify:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  release:
    needs: verify
    runs-on: ubuntu-latest
    # A dev cleanup must never run while release manifests are being uploaded.
    concurrency:
      group: ghcr-package-publish
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web frontend
        shell: bash
        run: bash scripts/build-web.sh   # real frontend output goes into the embedded binary


      - uses: docker/setup-qemu-action@v4       # register binfmt for arm64 image builds
      - uses: docker/setup-buildx-action@v4     # prerequisite for use: buildx in dockers

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

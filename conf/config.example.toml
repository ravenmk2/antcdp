[server]
listen = "0.0.0.0:8080"
public_url = "https://antcdp.example.com"

[database]
host = "mysql.example.internal"
port = 3306
name = "antcdp"
username = "antcdp"
password = "<database-password>"
tls_mode = "verify_identity"
ca_file = "certs/mysql-ca.pem"

